<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8">
        <title>Tabella</title>
    </head>
    <body>
        <h1>Tabella</h1>
        <table border="1">
            <thead>
                <tr>
                    <th>Prodotto</th>
                    <th>Prezzo</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Pane</td>
                    <td>1.00€</td>
                </tr>
                <tr>
                    <td>Latte</td>
                    <td>1.50€</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td>Totale</td>
                    <td>2.50€</td>
                </tr>
            </tfoot>
        </table>
    </body>
</html>
