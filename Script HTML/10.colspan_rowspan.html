<!DOCTYPE html>
<html>
<head>
    <title>Tabella con Colspan e Rowspan</title>
</head>
<body>
    <table border="1">
        <tr>
            <th rowspan="2">Materia</th>
            <th colspan="2">Studente</th>
        </tr>
        <tr>
            <th>Nome</th>
            <th>Cognome</th>
        </tr>
        <tr>
            <td>Fisica</td>
            <td>Giulia</td>
            <td>Verdi</td>
        </tr>
        <tr>
            <td>Chimica</td>
            <td>Marco</td>
            <td>Neri</td>
        </tr>
    </table>
</body>
</html>
