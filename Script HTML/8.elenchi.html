<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Elenchi</title>
    </head>
    <body>
        <h1>Elenchi</h1>
        <h2>Elenchi non ordinati</h2>
        <ul>
            <li>Elemento 1</li>
            <li>Elemento 2</li>
            <li>Elemento 3</li>
        </ul>
        <h2>Elenchi ordinati</h2>
        <ol>
            <li>Elemento 1</li>
            <li>Elemento 2</li>
            <li>Elemento 3</li>
        </ol>
        <h2>Elenchi definiti</h2>
        <dl>
            <dt>Elemento 1</dt>
            <dd>Descrizione 1</dd>
            <dt>Elemento 2</dt>
            <dd>Descrizione 2</dd>
            <dt>Elemento 3</dt>
            <dd>Descrizione 3</dd>
        </dl>
    </body>
</html>
